<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283228"/>
      <stop offset="100%" stop-color="#141814"/>
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD78"/>
      <stop offset="100%" stop-color="#F4C84B"/>
    </linearGradient>
    <linearGradient id="greenGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9A6F"/>
      <stop offset="100%" stop-color="#2D5C40"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background extending to the outer edges for Android maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled inside safe zone (central 70% safe zone) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Inner glowing badge card -->
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#1A201A" stroke="rgba(244, 200, 75, 0.3)" stroke-width="6"/>

    <!-- Left Angle Bracket < -->
    <path d="M 195 190 L 135 256 L 195 322" fill="none" stroke="url(#goldGradMask)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Slash / with Rubber Duck Beak Angle -->
    <line x1="280" y1="168" x2="232" y2="344" stroke="url(#greenGradMask)" stroke-width="24" stroke-linecap="round"/>

    <!-- Right Angle Bracket > -->
    <path d="M 317 190 L 377 256 L 317 322" fill="none" stroke="url(#goldGradMask)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small Duck Mascot Accent -->
    <circle cx="360" cy="155" r="14" fill="#F4C84B"/>
    <polygon points="372,152 388,155 372,158" fill="#F97316"/>
    <circle cx="356" cy="152" r="3.5" fill="#1F251F"/>

    <!-- XP Badge Pill -->
    <rect x="186" y="374" width="140" height="36" rx="18" fill="#F4C84B"/>
    <text x="256" y="399" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#1F251F" text-anchor="middle" letter-spacing="3">CODEXP</text>
  </g>
</svg>
